[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PZCode"  # Replace with your exact PyPI project name if different
version = "1.0.1" # Remember to bump this from your first manual release!
description = "A custom programming language interpreter"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    
]

[project.scripts]
pzcode = "pzcode:main" 
